<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cổng thanh toán - TRAN DINH HIEP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
  background:#04182b;
  color:#fff;
  overflow:auto;
}

.bg-anim{
  position:fixed;
  inset:0;
  z-index:0;
  background:url('https://i.pinimg.com/originals/30/d2/70/30d270bf7c9dfda91c87f035e0312b84.gif') center/cover no-repeat;
  filter:brightness(0.7);
  animation: bgFloat 25s ease-in-out infinite alternate;
}
@keyframes bgFloat{0%{background-position:center top;}100%{background-position:center bottom;}}

.wrap{
  position:relative;
  z-index:2;
  max-width:480px;
  margin:50px auto;
  padding:22px;
  border-radius:14px;
  background:rgba(255,255,255,0.1);
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
  text-align:center;
  backdrop-filter:blur(8px);
}
.card{background:#fff;border-radius:12px;padding:18px;text-align:center;color:#052b2b}
.acc-name{font-weight:800;font-size:22px;margin:8px 0}
.acc-num{font-weight:700;margin-bottom:10px}
.qr{width:240px;height:240px;margin:10px auto;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(3,20,30,0.2)}
.qr img{max-width:95%;max-height:95%;border-radius:8px}
.note{margin-top:12px;font-size:15px;color:#042b2b;padding:10px;border-radius:8px;background:rgba(255,255,255,0.9)}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{padding:12px 14px;border-radius:12px;border:0;font-weight:800;cursor:pointer}
.btn.secondary{background:#fff;border:2px dashed #0b5;color:#0b5}
.btn.primary{background:linear-gradient(90deg,#17c2a8,#0ea6ff);color:white;cursor:not-allowed}
.btn.report{background:#ff4d4d;color:#fff;font-weight:700}
.toast{position:fixed;top:10%;left:50%;transform:translateX(-50%);background:#fff0f0;color:#902020;padding:10px 14px;border-radius:10px;display:none;z-index:50}
.full{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:70;opacity:0;pointer-events:none;transition:opacity .4s}
.full.show{opacity:1;pointer-events:auto}
.full .box{background:rgba(255,255,255,0.05);padding:18px 24px;border-radius:14px;text-align:center;box-shadow:0 0 30px rgba(255,255,255,0.2)}
</style>
</head>
