<script>
(function(){
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let W = innerWidth, H = innerHeight;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(DPR,DPR);

  const qrWrap = document.querySelector('.qr-wrap');
  const qrRect = () => qrWrap.getBoundingClientRect();

  const METEOR_SPEED = 250;
  const MAX_SPARKS = 250;
  let meteors=[], sparks=[], flashes=[];

  function rand(a,b){return a + Math.random()*(b-a);}
  function spawnMeteor(){
    const qr = qrRect();
    const size = rand(6,18);
    const side = Math.floor(rand(0,4)); // 0: top, 1: bottom, 2: left, 3: right
    let x, y, vx, vy;
    switch(side){
      case 0: x = rand(qr.left-150, qr.right+150); y = -50; vx = 0; vy = METEOR_SPEED/60; break;
      case 1: x = rand(qr.left-150, qr.right+150); y = H + 50; vx = 0; vy = -METEOR_SPEED/60; break;
      case 2: x = -50; y = rand(qr.top-150, qr.bottom+150); vx = METEOR_SPEED/60; vy = 0; break;
      case 3: x = W+50; y = rand(qr.top-150, qr.bottom+150); vx = -METEOR_SPEED/60; vy = 0; break;
    }
    meteors.push({x,y,vx,vy,size,hue:rand(20,220),life:2000});
  }

  function spawnExplosion(x,y,hue,power){
    const count = Math.floor(rand(15,25)*power);
    for(let i=0;i<count;i++){
      const a = rand(0,Math.PI*2);
      const spd = rand(1,6)*power;
      sparks.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
                   life:rand(400,900),start:performance.now(),
                   hue:hue+rand(-30,30),alpha:1});
    }
    flashes.push({x,y,alpha:1,start:performance.now(),life:150});
  }

  function update(dt){
    const qr = qrRect();
    for(let i=meteors.length-1;i>=0;i--){
      const m = meteors[i];
      m.x += m.vx*dt*60;
      m.y += m.vy*dt*60;
      if(m.x > qr.left && m.x < qr.right && m.y > qr.top && m.y < qr.bottom){
        spawnExplosion(m.x,m.y,m.hue,1.5);
        meteors.splice(i,1);
        continue;
      }
      m.life -= dt*1000;
      if(m.life<=0 || m.x<-100 || m.x>W+100 || m.y<-100 || m.y>H+100){
        meteors.splice(i,1);
      }
    }

    for(let i=sparks.length-1;i>=0;i--){
      const s = sparks[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vx *= 0.98; s.vy *=0.98;
      const age = performance.now()-s.start;
      if(age > s.life) sparks.splice(i,1);
    }

    for(let i=flashes.length-1;i>=0;i--){
      const f = flashes[i];
      const age = performance.now()-f.start;
      f.alpha = Math.max(0,1-age/f.life);
      if(age>f.life) flashes.splice(i,1);
    }

    if(sparks.length>MAX_SPARKS) sparks.splice(0,sparks.length-MAX_SPARKS);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,W,H);

    // flashes
    for(const f of flashes){
      ctx.fillStyle = `rgba(255,240,180,${f.alpha})`;
      ctx.beginPath();
      ctx.arc(f.x,f.y,50,0,Math.PI*2);
      ctx.fill();
    }

    // meteors
    for(const m of meteors){
      ctx.beginPath();
      ctx.fillStyle = `hsl(${m.hue},100%,70%)`;
      ctx.arc(m.x,m.y,m.size,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = `hsl(${m.hue},100%,90%)`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // sparks
    for(const s of sparks){
      const age = (performance.now()-s.start)/s.life;
      const alpha = Math.max(0,s.alpha*(1-age));
      ctx.beginPath();
      ctx.fillStyle = `hsla(${s.hue},100%,70%,${alpha})`;
      ctx.arc(s.x,s.y,Math.max(0.8,2*(1-age)),0,Math.PI*2);
      ctx.fill();
    }
  }

  let last = performance.now();
  function tick(now){
    const dt = Math.min(0.04,(now-last)/1000);
    last = now;
    if(Math.random()<0.4) spawnMeteor();
    update(dt);
    draw();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  addEventListener('resize',()=>{
    W = innerWidth; H = innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  });
})();
</script>
