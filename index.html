<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanh toán</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: url('https://i.pinimg.com/originals/23/1a/1e/231a1e2fda24f5193bcf90b3a94b3f1e.gif') center/cover no-repeat fixed;
    font-family: 'Poppins', sans-serif;
    color: white;
    text-align: center;
    overflow: hidden;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    z-index: 1;
  }

  .container {
    position: relative;
    z-index: 2;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.6);
    padding: 30px;
    border-radius: 20px;
    display: inline-block;
    box-shadow: 0 0 30px rgba(255,255,255,0.3);
  }

  h1 { margin-bottom: 10px; }

  img {
    width: 220px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(255,255,255,0.5);
  }

  p { margin: 10px 0; font-size: 17px; }

  button {
    display: block;
    margin: 10px auto;
    padding: 10px 25px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg, #ff66cc, #66ccff);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover { transform: scale(1.05); }

  #message {
    font-size: 20px;
    color: #ffccff;
    margin-top: 15px;
  }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="container" id="main">
  <h1>Để tiếp tục, xin hãy thanh toán</h1>
  <img id="qr" src="https://i.imgur.com/z8pO5Lk.png" alt="Mã QR">
  <p>Nếu gặp vấn đề hãy liên hệ <b>0355567466</b></p>
  <p>Nội dung thanh toán là <b>số điện thoại của bạn</b></p>

  <button onclick="copyText('1234567890')">📋 Sao chép số tài khoản</button>
  <button onclick="copyText('0355567466')">📋 Sao chép SĐT liên hệ</button>
  <button onclick="downloadQR()">💾 Lưu mã QR về máy</button>
  <button id="confirmBtn" onclick="confirmPayment()">✅ Xác nhận đã chuyển tiền</button>
  <p id="message"></p>
</div>

<div class="container" id="success" style="display:none;">
  <h1>💫 Hệ thống đang xác nhận giao dịch...</h1>
  <p>❤️ Cảm ơn bạn đã thanh toán.</p>
  <img src="https://i.pinimg.com/originals/72/68/3c/72683cda1dfb33b7d2476a701ca6b2a8.gif" alt="Anime girl">
</div>

<script>
let canConfirm = false;

setTimeout(() => { canConfirm = true; }, 20000); // 20 giây

function confirmPayment() {
  if (!canConfirm) {
    document.getElementById("message").innerText = "❌ Bạn chưa chuyển tiền hoặc thời gian xác nhận chưa đủ.";
  } else {
    document.getElementById("main").style.display = "none";
    document.getElementById("success").style.display = "block";
  }
}

function copyText(text) {
  navigator.clipboard.writeText(text);
  alert("Đã sao chép: " + text);
}

function downloadQR() {
  const link = document.createElement('a');
  link.href = document.getElementById("qr").src;
  link.download = "ma_qr.png";
  link.click();
}
</script>
</body>
</html>
